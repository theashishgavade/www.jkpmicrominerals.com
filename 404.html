<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        404 - Page Not Found | JKP Micro Minerals
    </title>

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <link rel="stylesheet" href="assets/css/bootstrap.min.css">

    <link rel="stylesheet" href="assets/css/style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        .error-page {

            min-height: 85vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(135deg,
                    #f8fafc 0%,
                    #ffffff 100%);

        }

        .error-card {

            background: #fff;

            border-radius: 30px;

            padding: 70px 50px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .08);

            border:
                1px solid rgba(0, 0, 0, .05);

        }

        .error-number {

            font-size: 180px;

            font-weight: 900;

            line-height: 1;

            color: var(--secondary);

            margin-bottom: 15px;

        }

        .error-title {

            color: var(--primary);

            margin-bottom: 20px;

        }

        .error-description {

            max-width: 650px;

            margin: auto;

            margin-bottom: 35px;

            font-size: 18px;

        }

        .error-buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;

        }

        @media(max-width:768px) {

            .error-number {

                font-size: 100px;

            }

            .error-card {

                padding: 40px 25px;

            }

        }
    </style>

</head>

<body>

    <!-- NAVBAR -->

    <!-- Paste Your Existing Navbar Here -->

    <section class="error-page">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="error-card">

                        <div class="error-number">

                            404

                        </div>

                        <p style="font-size:14px;
letter-spacing:3px;
text-transform:uppercase;
color:#94a3b8;
margin-top:-10px;
">

                            Page Not Found

                        </p>

                        <h1 class="error-title">

                            Oops! Page Not Found

                        </h1>

                        <p class="error-description">

                            The page you are looking for may have been moved,
                            deleted, renamed or never existed.

                            Please return to our homepage or explore our
                            products and services.

                        </p>

                        <div class="error-buttons">

                            <a href="index.html" class="btn-primary-custom">

                                <i class="fas fa-home me-2"></i>

                                Back To Home

                            </a>

                            <a href="products.html" class="btn-secondary-custom">

                                <i class="fas fa-boxes-stacked me-2"></i>

                                View Products

                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- =========================
         SCRIPTS
    ========================== -->

    <script src="assets/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/main.js"></script>

</body>

</html>
